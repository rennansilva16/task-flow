services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Docker123@"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Docker123@' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: TaskFlowAPI/Dockerfile
    container_name: taskflow-api

    depends_on:
      sqlserver:
        condition: service_healthy
        
    environment:
      ConnectionStrings__TaskFlowConnection: "Server=sqlserver;Database=TaskFlow;User Id=sa;Password=Docker123@;TrustServerCertificate=true;"
    ports:
      - "7215:8080"
  client:
    build:
      context: .
      dockerfile: TaskFlow.Web.Client/Dockerfile
    container_name: taskflow-client

    depends_on:
      - api

    ports:
      - "7206:80"

volumes:
  sqlserver_data:
